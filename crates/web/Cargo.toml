[package]
name = "ark-web"
version.workspace = true
edition.workspace = true

[dependencies]
ark-core = { path = "../core" }
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
rexie = "0.6.2"
gloo-net = "0.6"
gloo-events = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlDialogElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "File", "FileList", "Event", "InputEvent", "SubmitEvent", "MouseEvent", "PointerEvent", "DragEvent", "ClipboardEvent", "DataTransfer", "DataTransferItemList", "DataTransferItem", "DomRect", "KeyboardEvent"] }
